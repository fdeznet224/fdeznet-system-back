<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Servicio no disponible</title>
<style>
  :root { --fondo: #f2f2f7; --tarjeta: #fff; --texto: #1c1c1e; --suave: #6e6e73; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #000; --tarjeta: #1c1c1e; --texto: #f2f2f7; --suave: #98989f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: var(--fondo); color: var(--texto); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; background: var(--tarjeta); border-radius: 16px; padding: 28px 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--suave); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Servicio no disponible por el momento</h1>
  <p>Intenta de nuevo en unos minutos. Si eres el administrador del sistema, comunícate con soporte.</p>
</main>
</body>
</html>
