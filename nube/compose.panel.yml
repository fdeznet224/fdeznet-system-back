# Panel central (panel.<dominio>). Solo en localhost: el proxy de la VPS lo publica.
#   docker compose -f compose.panel.yml --env-file secretos/panel.env up -d
# Monta nube/ en la misma ruta que en la VPS para que los compose de cada ISP
# resuelvan igual dentro y fuera del contenedor.
name: fdezpay-panel

services:
  panel:
    image: fdezpay-panel:${IMAGEN_VERSION:-local}
    build:
      context: ..
      dockerfile: nube/panel.Dockerfile
    restart: unless-stopped
    env_file: secretos/panel.env
    environment:
      NUBE_DIR: ${NUBE_DIR}
      PANEL_BASE: /data/panel.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NUBE_DIR}:${NUBE_DIR}
      - datos:/data
    ports:
      - "127.0.0.1:${PANEL_PORT:-18000}:8100"
    networks:
      - default
      - fdezpay-proxy
    mem_limit: 256m

  # WhatsApp de ventas: el mismo bot de los ISP. Con él llegan los accesos a los
  # demos que se piden en la página de registro. Se vincula en panel → WhatsApp.
  bot:
    image: fdezpay-bot:${PANEL_BOT_VERSION:?Falta PANEL_BOT_VERSION en secretos/panel.env}
    restart: unless-stopped
    environment:
      API_BACKEND_URL: http://panel:8100
      WEBHOOK_SECRET: ${PANEL_BOT_SECRETO:?Falta PANEL_BOT_SECRETO en secretos/panel.env}
      BOT_REINICIO_DIARIO: "04:30"
      TZ: America/Mexico_City
    stop_grace_period: 30s
    volumes:
      - bot-sesion:/app/bot_whatsapp/.wwebjs_auth
      - bot-archivos:/app/bot_whatsapp/uploads
    mem_limit: 1200m
    cpus: 1

volumes:
  datos:
  bot-sesion:
  bot-archivos:

networks:
  fdezpay-proxy:
    external: true
